<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Isabelle Image Schedule</title>
<link rel="icon" type="image/png" href="https://technextsg.github.io/technext-marketing-hub/assets/logo/technext-brandmark-blue.png">
<link rel="stylesheet" href="https://technextsg.github.io/technext-presentations/assets/fonts.css?v=39">
<style>
:root{
  --blue:#3167CA;--blue-700:#1E4691;--blue-100:#DDE7F8;--blue-050:#EEF3FC;
  --ink:#1F2238;--ink-2:#4A4E66;--ink-3:#7B8098;--line:#E5E8EF;--line-2:#EEF0F5;--bg:#F6F7FA;--card:#fff;
  --ok:#1F8A5B;--okbg:#E6F4EC;--warn:#B0650B;--warnbg:#FDF1DF;--bad:#B4323A;--badbg:#FCE8E9;
  --f-d:"Plus Jakarta Sans",Inter,system-ui,sans-serif;--f-b:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;--top:56px;--side:256px;--drawer:440px;
  --sh:0 1px 2px rgba(31,34,56,.05),0 6px 18px -12px rgba(31,34,56,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-b);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:30;height:var(--top);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.logo img{height:22px;width:auto}
.logo b{font:700 13px/1 var(--f-d);color:var(--ink-3);padding-left:10px;border-left:1px solid var(--line)}
.switch{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none;min-width:0}
.switch::-webkit-scrollbar{display:none}
.switch a{display:flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink-2);font:600 13px/1 var(--f-d);padding:7px 11px;border-radius:7px}
.switch a:hover{background:#fff}
.switch a[aria-current]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,34,56,.12)}
.switch a i{width:8px;height:8px;border-radius:50%;flex:none}
.top .sp{flex:1}
.top .lnk{font:600 13px/1 var(--f-d);color:var(--ink-2);text-decoration:none;padding:8px 10px;border-radius:8px;white-space:nowrap}
.top .lnk:hover{background:var(--bg)}

/* layout */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top))}
aside.side{border-right:1px solid var(--line);background:#fff;padding:16px 14px 40px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto}
main{min-width:0;padding:16px 20px 40px}

/* page head */
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0;font:800 22px/1.2 var(--f-d);letter-spacing:-.015em}
.head .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.head .pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-d);padding:6px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.q{background:var(--okbg);border-color:transparent;color:var(--ok)}
.pill.p{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.pill.s{background:var(--badbg);border-color:transparent;color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:600 13px/1 var(--f-d);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#C9D3E8;background:var(--blue-050)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-700)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg)}
.btn.icon{padding:7px}

/* toolbar */
.tool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:12px;position:sticky;top:calc(var(--top) + 8px);z-index:20;box-shadow:var(--sh)}
.mlabel{font:800 16px/1 var(--f-d);min-width:132px;padding:0 6px;letter-spacing:-.01em}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font:600 13px/1 var(--f-d);color:var(--ink-2)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,34,56,.14)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:0 9px;background:var(--bg);margin-left:auto;min-width:220px}
.search:focus-within{background:#fff;border-color:var(--blue)}
.search input{border:0;outline:0;background:none;padding:7px 0;width:100%;font-size:13.5px}
.search .ic{color:var(--ink-3)}
.fbtn{display:none}
.res{font-size:12px;color:var(--ink-3);padding:0 4px;white-space:nowrap}

/* sidebar */
.blk{margin-bottom:18px}
.blk h3{margin:0 0 8px;font:700 11px/1 var(--f-d);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between}
.blk h3 button{border:0;background:none;font:600 11.5px/1 var(--f-d);color:var(--blue);letter-spacing:0;text-transform:none;padding:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.stat b{display:block;font:800 18px/1.1 var(--f-d)}
.stat span{font-size:11.5px;color:var(--ink-3)}
.chk{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;cursor:pointer;user-select:none;font-size:13px;color:var(--ink-2)}
.chk:hover{background:var(--bg)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--c,#9AA0B5);display:grid;place-items:center;flex:none;background:#fff}
.chk input:checked+.box{background:var(--c,var(--blue));border-color:var(--c,var(--blue))}
.chk input:checked+.box::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.chk input:focus-visible+.box{outline:2px solid var(--blue);outline-offset:2px}
.chk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk .ct{font:600 11.5px/1 var(--f-d);color:var(--ink-3)}
.chk.off .nm{color:var(--ink-3)}
.kd{list-style:none;margin:0;padding:0}
.kd li{display:flex;gap:9px;padding:6px;border-radius:7px;cursor:pointer;font-size:12.5px;line-height:1.35}
.kd li:hover{background:var(--bg)}
.kd li.past{opacity:.5}
.kd .dd{flex:none;width:44px;font:700 11.5px/1.35 var(--f-d);color:var(--c,var(--blue))}
.kd b{display:block;font-weight:600;color:var(--ink)}
.kd span{color:var(--ink-3)}
.legend{display:grid;gap:6px;font-size:12px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:8px}
.lg{width:26px;height:14px;border-radius:4px;background:var(--blue-050);border-left:3px solid var(--blue);flex:none}
.lg.p{background:#fff;border:1px dashed #9AA0B5;border-left:3px dashed var(--blue)}
.lg.s{background:var(--badbg);border-left-color:var(--bad)}

/* platform badges */
.pf{display:inline-flex;gap:2px;flex:none}
.pb{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;font:800 8.5px/1 var(--f-d);color:#fff;background:var(--pc);letter-spacing:0}
.pb.off{background:#fff;color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc);opacity:.75}

/* month */
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);background:#FBFCFD}
.dow div{padding:8px 10px;font:700 11px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:138px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;background:#fff}
.day:nth-child(7n){border-right:0}
.day.out{background:#FAFBFC}
.day.out .dn{color:#B8BCCB}
.day.we{background:#FCFCFE}
.dh{display:flex;align-items:center;justify-content:space-between;padding:1px 3px 3px}
.dn{border:0;background:none;padding:2px 5px;border-radius:6px;font:700 12.5px/1.2 var(--f-d);color:var(--ink-2)}
.dn:hover{background:var(--blue-050);color:var(--blue-700)}
.day.today .dn{background:var(--blue);color:#fff}
.dq{font:700 10px/1 var(--f-d);color:var(--ok);display:flex;align-items:center;gap:3px}
.ev{display:flex;align-items:center;gap:5px;width:100%;min-width:0;border:0;text-align:left;padding:4px 6px 4px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 9%,#fff);border-left:3px solid var(--c);font-size:11.5px;line-height:1.25;color:var(--ink)}
.ev:hover{background:color-mix(in srgb,var(--c) 17%,#fff)}
.ev.p{background:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,#fff);border-left-style:dashed}
.ev.s{background:var(--badbg)}
.ev .tm{font:700 10px/1 var(--f-d);color:var(--ink-3);flex:none;min-width:30px}
.ev .tt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.ev .tg{font:800 9px/1 var(--f-d);color:var(--c);flex:none}
.ev.sel{outline:2px solid var(--blue);outline-offset:0}
.more{border:0;background:none;text-align:left;padding:2px 6px;font:600 11.5px/1.2 var(--f-d);color:var(--blue)}
.band{display:flex;gap:2px;margin-top:auto;padding-top:3px}
.band .bd{flex:1;height:6px;border:0;padding:0;border-radius:3px;background:color-mix(in srgb,var(--c) 55%,#fff)}
.band .bd:hover{background:var(--c)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:#fff;border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.wcol.today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.wh{padding:9px 10px;border-bottom:1px solid var(--line-2);display:flex;align-items:baseline;gap:6px}
.wh b{font:800 18px/1 var(--f-d)}
.wh span{font:600 12px/1 var(--f-d);color:var(--ink-3)}
.wh em{margin-left:auto;font:600 11px/1 var(--f-d);font-style:normal;color:var(--ink-3)}
.wl{padding:6px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.card{display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:7px;background:#fff;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--c) 45%,#fff);border-left-color:var(--c)}
.card.p{border-left-style:dashed}
.card.sel{outline:2px solid var(--blue)}
.card .r1{display:flex;align-items:center;gap:6px;font:700 10.5px/1 var(--f-d);color:var(--ink-3)}
.card .r1 .tg{color:var(--c);margin-left:auto}
.card img{width:100%;height:118px;object-fit:cover;object-position:top;border-radius:6px;background:var(--bg)}
.card img.w{height:auto;aspect-ratio:16/9;object-position:center}
.card .tt{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .r3{display:flex;align-items:center;gap:6px;justify-content:space-between}
.empty{color:var(--ink-3);font-size:12px;text-align:center;padding:16px 4px}

/* list */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:clip}
.lday{display:flex;align-items:baseline;gap:8px;padding:10px 14px 6px;background:#FBFCFD;border-bottom:1px solid var(--line-2);position:sticky;top:calc(var(--top) + 70px);z-index:5}
.lday b{font:800 14px/1 var(--f-d)}
.lday span{font-size:12px;color:var(--ink-3)}
.lday.today b{color:var(--blue)}
.row{display:grid;grid-template-columns:70px 44px minmax(0,1fr) 150px 110px 96px;align-items:center;gap:12px;padding:8px 14px;border:0;border-bottom:1px solid var(--line-2);background:#fff;width:100%;text-align:left}
.row:hover{background:#FAFBFE}
.row.sel{background:var(--blue-050)}
.row .tm{font:700 12px/1 var(--f-d);color:var(--ink-2)}
.row img,.row .ph{width:44px;height:55px;object-fit:cover;border-radius:6px;background:var(--bg);border-left:3px solid var(--c)}
.row .ttl b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl span{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--f-d);color:var(--ink-2);min-width:0}
.tchip i{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.tchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 var(--f-d);padding:5px 8px;border-radius:999px;white-space:nowrap}
.st.q{background:var(--okbg);color:var(--ok)}.st.p{background:var(--warnbg);color:var(--warn)}.st.s{background:var(--badbg);color:var(--bad)}
.noresult{padding:40px 16px;text-align:center;color:var(--ink-3);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(31,34,56,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--drawer),100vw);background:#fff;z-index:41;box-shadow:-12px 0 40px -18px rgba(31,34,56,.4);transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhd{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dhd .tchip{margin-right:auto}
.dbd{overflow-y:auto;padding:16px 18px 28px;flex:1}
.dimg{display:block;width:100%;border-radius:10px;background:var(--bg);margin-bottom:14px;border:1px solid var(--line)}
.dimg.port{max-width:260px;margin-left:auto;margin-right:auto}
.dbd h2{margin:0 0 4px;font:800 19px/1.25 var(--f-d);letter-spacing:-.01em}
.dbd .when{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.meta{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
.meta td{padding:6px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.meta td:first-child{color:var(--ink-3);width:34%;padding-right:10px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;overflow-x:auto}
.ptab{border:0;background:none;padding:8px 10px;font:600 13px/1 var(--f-d);color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ptab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue)}
.ptm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.cap{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 8px;color:var(--ink)}
.fc{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--blue-050);border-radius:8px;padding:8px 10px;margin:0 0 12px}
.dnav{font-size:12px;color:var(--ink-3);padding:0 4px}

/* info drawer content */
.info h3{font:800 15px/1.3 var(--f-d);margin:18px 0 6px}
.info h3:first-child{margin-top:0}
.info p,.info li{font-size:13px;color:var(--ink-2);margin:0 0 6px}
.info ul{padding-left:18px;margin:0 0 8px}
.info table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
.info th,.info td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line-2)}
.info th{font:700 11px/1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* responsive */
@media (max-width:1180px){:root{--side:224px}.row{grid-template-columns:62px 44px minmax(0,1fr) 120px 96px}.row .pfc{display:none}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside.side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(300px,88vw);z-index:42;transform:translateX(-102%);transition:transform .25s;box-shadow:12px 0 40px -18px rgba(31,34,56,.4);padding-top:14px}
  aside.side.on{transform:none}
  .fbtn{display:inline-flex}
  .week{grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px}
  .top .lnk{display:none}
}
@media (max-width:720px){
  main{padding:12px 12px 32px}
  .logo b{display:none}
  .search{order:9;margin-left:0;flex-basis:100%}
  .head .pills{margin-left:0}
  .day{min-height:64px;padding:3px}
  .ev{padding:0;height:6px;border-left-width:0;border-radius:3px;background:var(--c)}
  .ev.p{background:color-mix(in srgb,var(--c) 40%,#fff)}
  .ev>*{display:none}
  .more{font-size:10px;padding:0 2px}
  .dow div{padding:6px 2px;font-size:9.5px;text-align:center}
  .row{grid-template-columns:52px 40px minmax(0,1fr);gap:10px;padding:8px 10px}
  .row .tcc,.row .stc{display:none}
  .lday{top:calc(var(--top) + 118px)}
  .tool{top:calc(var(--top) + 6px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="https://technextmarketing.github.io/technext-plans/all-schedules.html"><img src="https://technextsg.github.io/technext-marketing-hub/assets/logo/technext-wide-blue.png" alt="TechNext" width="110" height="22"><b>Schedules</b></a>
  <nav class="switch" id="switch" aria-label="Schedules"></nav>
  <span class="sp"></span>
  <a class="lnk" href="https://technextmarketing.github.io/technext-plans/all-schedules.html">All schedules</a>
  <a class="lnk" href="https://technextsg.github.io/technext-marketing-hub/">Marketing Hub</a>
</header>

<div class="app">
  <aside class="side" id="side" aria-label="Filters">
    <div class="blk"><h3>Overview</h3><div class="stats" id="stats"></div></div>
    <div class="blk"><h3>Type <button type="button" data-all="type">All</button></h3><div id="f-type"></div></div>
    <div class="blk" id="b-topic"><h3>Topic <button type="button" data-all="topic">All</button></h3><div id="f-topic"></div></div>
    <div class="blk"><h3>Platform <button type="button" data-all="plat">All</button></h3><div id="f-plat"></div></div>
    <div class="blk"><h3>Status <button type="button" data-all="st">All</button></h3><div id="f-st"></div></div>
    <div class="blk"><h3>Key dates</h3><ul class="kd" id="kd"></ul></div>
    <div class="blk"><h3>Legend</h3><div class="legend">
      <div><i class="lg"></i>Queued (Buffer / YouTube)</div>
      <div><i class="lg p"></i>Planned, not queued yet</div>
      <div><i class="lg s"></i>Still to set up</div>
      <div><span class="pf"><i class="pb" style="--pc:#3167CA">FB</i></span>Posts there &middot; <span class="pf"><i class="pb off" style="--pc:#3167CA">FB</i></span>planned only</div>
    </div></div>
  </aside>

  <main>

<li><b>Certification fills the gaps.</b> The 2027 certification posts go on the free days. They pick up in December and finish on 31 Dec, the last day of the S$5,888 early-bird price.</li>
<li><b>One image a day at most, at 12:00 PM,</b> so it never clashes with the 7:00 PM video post.</li></ul>

    return '<label class="chk'+(on?'':' off')+'" style="--c:'+color(k)+'"><input type="checkbox" data-f="'+name+'" value="'+esc(k)+'"'+(on?' checked':'')+'><span class="box"></span><span class="nm">'+esc(label(k))+'</span><span class="ct">'+count(k)+'</span></label>'}).join("");
}
var TK=Object.keys(C.types).filter(function(k){return IT.some(function(e){return e.type===k})});
var TPK=C.topics?Object.keys(C.topics).filter(function(k){return IT.some(function(e){return e.topic===k})}):[];
var PK=Object.keys(PL).filter(function(k){return IT.some(function(e){return (e.pl||[]).some(function(p){return p.k===k})})});
var SK=Object.keys(ST).filter(function(k){return IT.some(function(e){return e.st===k})});
function drawFacets(){
  facet("type",TK,function(k){return C.types[k].n},function(k){return C.types[k].c},function(k){return IT.filter(function(e){return e.type===k}).length});
  $("b-topic").hidden=!TPK.length;
  if(TPK.length)facet("topic",TPK,function(k){return C.topics[k].n},function(k){return C.topics[k].c},function(k){return IT.filter(function(e){return e.topic===k}).length});
  facet("plat",PK,function(k){return PL[k].n},function(k){return PL[k].c},function(k){return IT.filter(function(e){return (e.pl||[]).some(function(p){return p.k===k})}).length});
  facet("st",SK,function(k){return ST[k]},function(k){return {q:"#1F8A5B",p:"#B0650B",s:"#B4323A"}[k]},function(k){return IT.filter(function(e){return e.st===k}).length});
}
$("side").addEventListener("change",function(e){var t=e.target;if(!t.dataset.f)return;S.f[t.dataset.f][t.value]=t.checked;save();t.closest(".chk").classList.toggle("off",!t.checked);render()});
$("side").addEventListener("click",function(e){var b=e.target.closest("[data-all]");if(!b)return;var n=b.dataset.all,f=S.f[n],any=Object.keys(f).some(function(k){return f[k]===false});
  var ks=n==="type"?TK:n==="topic"?TPK:n==="plat"?PK:SK;ks.forEach(function(k){f[k]=any?true:(k===ks[0])});save();drawFacets();render()});
function vis(e){
  var f=S.f;if(f.type[e.type]===false)return false;
  if(e.topic&&f.topic[e.topic]===false)return false;
  if(e.st&&f.st[e.st]===false)return false;
  if(e.pl&&e.pl.length&&!e.pl.some(function(p){return f.plat[p.k]!==false}))return false;
  if(S.q&&e.q.indexOf(S.q)<0)return false;
  return true;
}

/* ----- header, stats, key dates ----- */
$("switch").innerHTML=PAGES.map(function(p){return '<a href="'+p.href+'"'+(p.id===C.id?' aria-current="page"':'')+'><i style="background:'+p.c+'"></i>'+p.label+'</a>'}).join("");
document.title=C.title+" · TechNext Schedules";
$("h1").textContent=C.title;$("hsub").innerHTML=C.sub;
function cnt(st){return IT.filter(function(e){return e.st===st&&!e.band}).length}
$("hpills").innerHTML=SK.map(function(k){return '<span class="pill '+k+'">'+cnt(k)+' '+ST[k].toLowerCase()+'</span>'}).join("")+'<span class="pill">'+nice(first).replace(/^\w+ /,"")+' – '+nice(last,1).replace(/^\w+ /,"")+'</span>';
(function(){var wk=IT.filter(function(e){var d=(pd(e.d)-pd(TODAY))/864e5;return !e.band&&d>=0&&d<7}).length,td=(byDay[TODAY]||[]).length,all=IT.filter(function(e){return !e.band}).length;
  $("stats").innerHTML=[[all,"items"],[Math.round(cnt("q")/Math.max(all,1)*100)+"%","queued"],[td,"today"],[wk,"next 7 days"]].map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("")})();
$("kd").innerHTML=(C.keydates||[]).map(function(k){return '<li data-go="'+k.d+'" class="'+((k.end||k.d)<TODAY?"past":"")+'" style="--c:'+(k.c||"#3167CA")+'"><span class="dd">'+nice(k.d).replace(/^\w+ /,"")+(k.end?'<br>– '+nice(k.end).replace(/^\w+ /,""):"")+'</span><span><b>'+esc(decode(k.t))+'</b>'+(k.x?'<span>'+esc(decode(k.x))+'</span>':'')+'</span></li>'}).join("")||'<li><span>None</span></li>';
$("kd").addEventListener("click",function(e){var li=e.target.closest("[data-go]");if(!li)return;cur=pd(li.dataset.go);if(S.view==="list")S.view="week";render();closeSide()});

/* ----- render ----- */
function pbadges(e){return '<span class="pf">'+(e.pl||[]).map(function(p){var P=PL[p.k];return '<i class="pb'+(p.off?' off':'')+'" style="--pc:'+P.c+'" title="'+P.n+(p.time?' '+p.time:'')+(p.off?' (planned)':'')+'">'+P.a+'</i>'}).join("")+'</span>'}
function tcol(e){return (C.types[e.type]||{}).c||"#8088A0"}
function dayDone(k){var L=byDay[k]||[];return L.length&&L.every(function(e){return e.st==="q"})}
function render(){
  document.querySelectorAll("#views button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===S.view)});
  var shown=IT.filter(function(e){return !e.band&&vis(e)}).length,total=IT.filter(function(e){return !e.band}).length;
  $("res").textContent=shown===total?total+" items":shown+" of "+total;
  if(S.view==="month")month();else if(S.view==="week")week();else list();
}
function month(){
  var y=cur.getFullYear(),m=cur.getMonth(),f=new Date(y,m,1),start=new Date(y,m,1-((f.getDay()+6)%7));
  $("mlabel").textContent=MONL[m]+" "+y;
  var h='<div class="cal"><div class="dow">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(d){return"<div>"+d+"</div>"}).join("")+'</div><div class="grid">';
  var cells=Math.ceil(((f.getDay()+6)%7+new Date(y,m+1,0).getDate())/7)*7;
  for(var i=0;i<cells;i++){
    var dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=key(dt),out=dt.getMonth()!==m;
    var L=(byDay[k]||[]).filter(vis),max=5,B=BANDS.filter(function(b){return b.d<=k&&k<=b.end&&vis(b)});
    h+='<div class="day'+(out?" out":"")+(k===TODAY?" today":"")+(dt.getDay()%6===0?" we":"")+'"><div class="dh"><button type="button" class="dn" data-day="'+k+'" title="Open this week">'+dt.getDate()+'</button>'+(dayDone(k)&&!out?'<span class="dq" title="Everything this day is queued">'+svg('<path d="m5 12 5 5 9-10"/>')+'</span>':'')+'</div>';
    if(!out){
      L.slice(0,L.length>max?max-1:max).forEach(function(e){h+='<button type="button" class="ev '+e.st+(e.i===sel?" sel":"")+'" style="--c:'+tcol(e)+'" data-i="'+e.i+'" title="'+esc((e.timeShow?e.timeShow+" · ":"")+e.title)+'"><span class="tm">'+esc(shortT(e.timeShow))+'</span><span class="tt">'+esc(e.title)+'</span>'+(e.tag?'<span class="tg">'+esc(e.tag)+'</span>':'')+'</button>'});
      if(L.length>max)h+='<button type="button" class="more" data-day="'+k+'">+'+(L.length-max+1)+' more</button>';
      if(B.length)h+='<div class="band">'+B.map(function(b){return '<button type="button" class="bd" style="--c:'+tcol(b)+'" data-i="'+b.i+'" title="'+esc(b.title)+'"></button>'}).join("")+'</div>';
    }
    h+='</div>';
  }
  $("view").innerHTML=h+'</div></div>';
}
function shortT(t){return t?t.replace(":00","").replace(" AM","a").replace(" PM","p"):""}
function weekStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7))}
function week(){
  var s=weekStart(cur),e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);
  $("mlabel").textContent=s.getDate()+" "+MON[s.getMonth()]+" – "+e.getDate()+" "+MON[e.getMonth()]+" "+e.getFullYear();
  var h='<div class="week">';
  for(var i=0;i<7;i++){var dt=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i),k=key(dt),L=(byDay[k]||[]).filter(vis),B=BANDS.filter(function(b){return (i===0?(b.d<=k&&k<=b.end):b.d===k)&&vis(b)});
    h+='<div class="wcol'+(k===TODAY?" today":"")+'"><div class="wh"><b>'+dt.getDate()+'</b><span>'+DN[dt.getDay()]+'</span><em>'+(L.length?L.length+" item"+(L.length>1?"s":""):"")+'</em></div><div class="wl">'+
      (L.map(function(e){return '<button type="button" class="card '+e.st+(e.i===sel?" sel":"")+'" style="--c:'+tcol(e)+'" data-i="'+e.i+'"><span class="r1"><span>'+esc(e.timeShow||"")+'</span>'+(e.tag?'<span class="tg">'+esc(e.tag)+'</span>':'')+'</span>'+(e.img?'<img loading="lazy" alt="" src="'+e.img+'"'+(e.wide?' class="w"':'')+'>':'')+'<span class="tt">'+esc(e.title)+'</span><span class="r3">'+pbadges(e)+'<span class="st '+e.st+'">'+ST[e.st]+'</span></span></button>'}).join("")||'<div class="empty">Nothing</div>')+
      B.map(function(b){return '<button type="button" class="card p" style="--c:'+tcol(b)+'" data-i="'+b.i+'"><span class="r1"><span>Running</span></span><span class="tt">'+esc(b.title)+'</span></button>'}).join("")+'</div></div>'}
  $("view").innerHTML=h+'</div>';
}
function list(){
  var y=cur.getFullYear(),m=cur.getMonth(),pre=y+"-"+pad(m+1);
  $("mlabel").textContent=MONL[m]+" "+y;
  var days=Object.keys(byDay).filter(function(k){return k.slice(0,7)===pre}).sort(),h="",n=0;
  days.forEach(function(k){var L=byDay[k].filter(vis);if(!L.length)return;n+=L.length;
    h+='<div class="lday'+(k===TODAY?" today":"")+'" id="d'+k+'"><b>'+nice(k)+'</b><span>'+L.length+' item'+(L.length>1?"s":"")+(k===TODAY?" · today":"")+'</span></div>'+
      L.map(function(e){return '<button type="button" class="row'+(e.i===sel?" sel":"")+'" style="--c:'+tcol(e)+'" data-i="'+e.i+'"><span class="tm">'+esc(e.timeShow||"")+'</span>'+(e.img?'<img loading="lazy" alt="" src="'+e.img+'">':'<span class="ph"></span>')+'<span class="ttl"><b>'+esc(e.title)+'</b><span>'+esc(e.sub||"")+'</span></span><span class="tcc"><span class="tchip"><i></i><span>'+esc((C.types[e.type]||{}).n||"")+'</span></span></span><span class="pfc">'+pbadges(e)+'</span><span class="stc"><span class="st '+e.st+'">'+ST[e.st]+'</span></span></button>'}).join("")});
  var B=BANDS.filter(function(b){return b.d.slice(0,7)<=pre&&b.end.slice(0,7)>=pre&&vis(b)});
  if(B.length)h+='<div class="lday"><b>Running all month</b><span>'+B.length+'</span></div>'+B.map(function(e){return '<button type="button" class="row" style="--c:'+tcol(e)+'" data-i="'+e.i+'"><span class="tm">'+nice(e.d).replace(/^\w+ /,"")+'</span>'+(e.img?'<img loading="lazy" alt="" src="'+e.img+'">':'<span class="ph"></span>')+'<span class="ttl"><b>'+esc(e.title)+'</b><span>'+esc(e.sub||"")+'</span></span><span class="tcc"><span class="tchip"><i></i><span>'+esc(C.types[e.type].n)+'</span></span></span><span class="pfc">'+pbadges(e)+'</span><span class="stc"><span class="st '+e.st+'">'+ST[e.st]+'</span></span></button>'}).join("");
  $("view").innerHTML=h?'<div class="list">'+h+'</div>':'<div class="noresult">Nothing this month for these filters.</div>';
}

/* ----- navigation ----- */
function step(dir){if(S.view==="week")cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+7*dir);else cur=new Date(cur.getFullYear(),cur.getMonth()+dir,1);render()}
$("prev").onclick=function(){step(-1)};$("next").onclick=function(){step(1)};
$("today").onclick=function(){cur=pd(TODAY);render();if(S.view==="list"){var t=$("d"+TODAY);if(t)t.scrollIntoView({block:"center"})}};
$("views").onclick=function(e){var b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;try{localStorage.setItem(LS+":v","1")}catch(x){}save();render()};
$("view").addEventListener("click",function(e){var d=e.target.closest("[data-day]");if(d){cur=pd(d.dataset.day);S.view="week";save();render();return}
  var b=e.target.closest("[data-i]");if(b)openItem(+b.dataset.i)});
var qt;$("q").addEventListener("input",function(){clearTimeout(qt);var v=this.value;qt=setTimeout(function(){S.q=v.trim().toLowerCase();
  if(S.q){var hit=IT.filter(vis).filter(function(e){return e.d>=TODAY})[0]||IT.filter(vis)[0];if(hit&&S.view!=="week")cur=pd(hit.d)}render()},120)});

/* ----- drawer ----- */
var tab=null;
function order(){return IT.filter(vis)}
function openItem(i){sel=i;var e=IT[i],P=e.pl||[];if(!tab||!P.some(function(p){return p.k===tab}))tab=P.length?P[0].k:null;
  var O=order(),pos=O.indexOf(e);
  $("dhd").innerHTML='<span class="tchip" style="--c:'+tcol(e)+'"><i></i><span>'+esc((C.types[e.type]||{}).n||"")+(e.topic&&C.topics?' · '+esc(C.topics[e.topic].n):'')+'</span></span><span class="dnav">'+(pos+1)+' / '+O.length+'</span>'+
    '<button type="button" class="btn icon ghost" data-nav="-1" aria-label="Previous item" title="Previous (←)">'+svg('<path d="m15 18-6-6 6-6"/>')+'</button><button type="button" class="btn icon ghost" data-nav="1" aria-label="Next item" title="Next (→)">'+svg('<path d="m9 18 6-6-6-6"/>')+'</button><button type="button" class="btn icon ghost" data-x aria-label="Close" title="Close (Esc)">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button>';
  var h="";
  if(e.img)h+=(e.full?'<a href="'+e.full+'" target="_blank" rel="noopener" title="Open full size">':'')+'<img class="dimg'+(e.wide?'':' port')+'" alt="" src="'+(e.full||e.img)+'">'+(e.full?'</a>':'');
  h+='<h2>'+esc(e.title)+'</h2><div class="when">'+nice(e.d,1)+(e.end?' – '+nice(e.end,1):'')+(e.timeShow?' · '+esc(e.timeShow):'')+' &nbsp;<span class="st '+e.st+'">'+ST[e.st]+'</span></div>';
  if(e.note)h+='<p class="note">'+e.note+'</p>';
  if(e.meta&&e.meta.length)h+='<table class="meta">'+e.meta.map(function(m){return '<tr><td>'+esc(m[0])+'</td><td>'+m[1]+'</td></tr>'}).join("")+'</table>';
  if(P.length){
    h+='<div class="ptabs" role="tablist">'+P.map(function(p){return '<button type="button" class="ptab" role="tab" data-tab="'+p.k+'" aria-selected="'+(p.k===tab)+'"><i class="pb'+(p.off?' off':'')+'" style="--pc:'+PL[p.k].c+'">'+PL[p.k].a+'</i>'+PL[p.k].n+'</button>'}).join("")+'</div>';
    var p=P.filter(function(x){return x.k===tab})[0]||P[0];
    h+='<div class="ptm"><span>'+(p.time?'<b>'+esc(p.time)+'</b>':'')+(p.status?' · '+esc(p.status):p.off?' · planned only':'')+'</span>'+(p.cap?'<button type="button" class="btn" data-copy>'+svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>')+'Copy caption</button>':'')+'</div>';
    h+=p.cap?'<div class="cap">'+esc(p.cap)+'</div>':'<p class="fc">No caption for this channel.</p>';
    if(p.fc)h+='<p class="fc"><b>First comment:</b> '+esc(p.fc)+'</p>';
  }
  if(e.links&&e.links.length)h+='<div class="links">'+e.links.map(function(l,j){return '<a class="btn'+(j?'':' pri')+'" href="'+esc(l.h)+'" target="_blank" rel="noopener">'+esc(l.t)+'</a>'}).join("")+'</div>';
  $("dbd").innerHTML=h;$("dbd").scrollTop=0;showDrawer();
  document.querySelectorAll(".sel").forEach(function(x){x.classList.remove("sel")});
  document.querySelectorAll('[data-i="'+i+'"]').forEach(function(x){x.classList.add("sel")});
}
function showDrawer(){$("drawer").classList.add("on");$("scrim").classList.add("on")}
function closeDrawer(){$("drawer").classList.remove("on");$("scrim").classList.remove("on");sel=-1;document.querySelectorAll(".sel").forEach(function(x){x.classList.remove("sel")})}
function nav(d){var O=order(),pos=O.indexOf(IT[sel]);var n=O[pos+d];if(!n)return;
  var nd=pd(n.d);if(S.view==="week"?key(weekStart(nd))!==key(weekStart(cur)):nd.getMonth()!==cur.getMonth()||nd.getFullYear()!==cur.getFullYear()){cur=nd;render()}openItem(n.i)}
$("dhd").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-x"))closeDrawer();else if(b.dataset.nav)nav(+b.dataset.nav)});
$("dbd").addEventListener("click",function(e){var t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;openItem(sel);return}
  var c=e.target.closest("[data-copy]");if(c){var p=(IT[sel].pl||[]).filter(function(x){return x.k===tab})[0];if(!p)return;copy(p.cap,c)}});
function copy(t,b){function ok(){var o=b.innerHTML;b.textContent="Copied";setTimeout(function(){b.innerHTML=o},1300)}
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(x){fb()}
  function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(y){}a.remove()}}
$("scrim").onclick=function(){closeDrawer();closeSide()};
$("infob").onclick=function(){sel=-1;$("dhd").innerHTML='<span class="tchip" style="--c:#3167CA"><i></i><span>Plan notes</span></span><span style="flex:1"></span><button type="button" class="btn icon ghost" data-x aria-label="Close">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button>';
  $("dbd").innerHTML='<div class="info">'+C.notes+'</div>';showDrawer()};
function closeSide(){$("side").classList.remove("on");if(!$("drawer").classList.contains("on"))$("scrim").classList.remove("on")}
$("fbtn").onclick=function(){$("side").classList.add("on");$("scrim").classList.add("on")};
document.addEventListener("keydown",function(e){var inInput=/input|textarea|select/i.test(document.activeElement.tagName);
  if(e.key==="Escape"){if($("drawer").classList.contains("on"))closeDrawer();else if($("side").classList.contains("on"))closeSide();else if(inInput){$("q").value="";S.q="";render();$("q").blur()}return}
  if(inInput)return;
  if(e.key==="/"){e.preventDefault();$("q").focus();return}
  var open=$("drawer").classList.contains("on")&&sel>-1;
  if(e.key==="ArrowRight"){open?nav(1):step(1)}else if(e.key==="ArrowLeft"){open?nav(-1):step(-1)}
  else if(e.key==="t"||e.key==="T")$("today").click();
  else if(e.key==="m")$("views").querySelector('[data-v=month]').click();else if(e.key==="w")$("views").querySelector('[data-v=week]').click();else if(e.key==="l")$("views").querySelector('[data-v=list]').click();
});
drawFacets();if(S.q)$("q").value=S.q;render();
window.__open=function(i){openItem(i)};
if(/(^|&)open=(\d+)/.test(location.hash.slice(1)))openItem(+RegExp.$2);
})();
</script>
</body>
</html>
